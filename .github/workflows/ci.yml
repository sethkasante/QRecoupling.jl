name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12']
        os: [ubuntu-latest]
        include:
          - julia-version: '1.12'
            os: windows-latest
          - julia-version: '1.12'
            os: macos-latest
    env:
      JULIA_NUM_THREADS: 4
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache dependencies
        uses: julia-actions/cache@v3

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Test without Nemo
        run: julia --startup-file=no test/core_environment.jl

      - name: Test the TensorKit sectors
        if: matrix.os == 'ubuntu-latest'
        run: julia --startup-file=no test/tensorkit_environment.jl

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          coverage: false

