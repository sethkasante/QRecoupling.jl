name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

# permissions for TagBot to create releases and tags
permissions:
  contents: write

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Push tags with the deploy key, so that the tag push triggers the Docs workflow
          # (pushes made with GITHUB_TOKEN do not start other workflows).
          ssh: ${{ secrets.DOCUMENTER_KEY }}